- id: agent-default-model
  config:
    provider: mem9-fixture
    model: mem9-fixture

- id: llm-deepseek
  disabled: true

- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: mem9-loader-fixture
      name: './test-fixtures/loader-fixture.ts'

    - id: mem9
      name: './test-fixtures/mem9-index.ts'
      config:
        apiUrl: !!js process.env.MEM9_TEST_API_URL
        apiKeyEnv: MEM9_API_KEY
