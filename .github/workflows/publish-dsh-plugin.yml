name: Publish DeepSeek plugin

on:
  push:
    branches: [main]
    paths:
      - "dsh-plugin/**"
      - ".github/workflows/publish-dsh-plugin.yml"

permissions:
  contents: read

jobs:
  publish:
    name: Publish @mem9/dsh-plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Read package version
        id: package
        working-directory: dsh-plugin
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Resolve npm dist tag
        id: npm-tag
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          const version = process.env.PACKAGE_VERSION ?? "";
          const outputPath = process.env.GITHUB_OUTPUT;
          const match = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z-]+)(?:\.\d+)?)?$/.exec(version);

          if (!match) {
            console.error(`::error::Unsupported package version format: ${version}`);
            process.exit(1);
          }

          const channel = match[4];
          const tag = channel ?? "latest";
          if (!["latest", "alpha", "beta", "rc"].includes(tag)) {
            console.error(`::error::Unsupported prerelease channel in ${version}; use alpha, beta, or rc.`);
            process.exit(1);
          }

          fs.appendFileSync(outputPath, `tag=${tag}\n`);
          NODE

      - name: Check npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::Missing NPM_TOKEN repository secret."
            exit 1
          fi

      - name: Check package version is unpublished
        run: |
          set -euo pipefail
          if npm view "@mem9/dsh-plugin@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "::error::@mem9/dsh-plugin@${{ steps.package.outputs.version }} already exists on npm."
            exit 1
          fi

      - name: Install dependencies
        working-directory: dsh-plugin
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: dsh-plugin
        run: pnpm test

      - name: Typecheck
        working-directory: dsh-plugin
        run: pnpm run typecheck

      - name: Pack check
        working-directory: dsh-plugin
        run: pnpm run pack:check

      - name: Publish
        working-directory: dsh-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --tag "${{ steps.npm-tag.outputs.tag }}" --no-git-checks
